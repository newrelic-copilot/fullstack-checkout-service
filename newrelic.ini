# ---------------------------------------------------------------------------
# This file configures the New Relic Python Agent.
#
# The path to the configuration file should be supplied to the function
# newrelic.agent.initialize() when the agent is being initialized.
#
# The configuration file follows a structure similar to what you would
# find for Microsoft Windows INI files. For further information on the
# configuration file format see the Python ConfigParser documentation at:
#
#    http://docs.python.org/library/configparser.html
#
# For further discussion on the behaviour of the Python agent that can
# be configured via this configuration file see:
#
#    http://newrelic.com/docs/python/python-agent-configuration
#
# ---------------------------------------------------------------------------

# Here are the settings that are common to all environments.

[newrelic]

# You must specify the license key associated with your New Relic account.
# This key binds the Python Agent's data to your account in the New Relic service.
# This can also be set via the NEW_RELIC_LICENSE_KEY environment variable (recommended).
license_key = ${NEW_RELIC_LICENSE_KEY}

# The application name. Set this to be descriptive of your application.
# This can also be set via the NEW_RELIC_APP_NAME environment variable (recommended).
app_name = ${NEW_RELIC_APP_NAME:Fullstack Checkout Service}

# New Relic offers distributed tracing for monitoring and analyzing modern,
# distributed systems. Enable distributed tracing.
distributed_tracing.enabled = true

# When "true", the agent collects performance data about your application.
monitor_mode = true

# Sets the name of a file to log agent messages to. Useful for debugging any
# issues with the agent. This is not set by default as it is not known in
# advance what user your web application processes will run as and where they
# have permission to write to. Whatever you set this to you must ensure that
# the permissions for the containing directory and the file itself are correct.
# This can also be set via the NEW_RELIC_LOG environment variable.
# log_file = /tmp/newrelic-python-agent.log

# Sets the level of detail of messages sent to the log file, if a log file
# location has been provided. Possible values, in increasing order of detail,
# are: critical, error, warning, info, debug. When reporting any agent issues
# to New Relic technical support, the most useful setting for the support
# engineers is debug. However, this can generate a lot of information very
# quickly, so it is best not to keep the agent at this level for longer than
# it takes to reproduce the problem you are experiencing.
log_level = info

# High security mode enforces certain security settings and prevents you from
# overriding them. This mode requires you to enable high security mode in both
# your New Relic UI and this agent configuration file. When set to true, the
# New Relic UI cannot override any of these local high security settings.
high_security = false

# The Python Agent will attempt to connect directly to the New Relic service.
# If there is an intermediate firewall between your host and the New Relic
# service that requires you to use a HTTP proxy, then you should set both the
# "proxy_host" and "proxy_port" settings to the required values for the HTTP
# proxy. The "proxy_user" and "proxy_pass" settings should additionally be set
# if proxy authentication is implemented by the HTTP proxy. The "proxy_scheme"
# setting dictates what protocol scheme is used in talking to the HTTP proxy.
# This would normally always be set as "http" which will result in the agent
# then using a SSL tunnel through the HTTP proxy for end to end encryption.
# proxy_scheme = http
# proxy_host = hostname
# proxy_port = 8080
# proxy_user =
# proxy_pass =

# Capturing request parameters is off by default. Enable this if you want
# visibility into request parameters. This setting does not apply to
# parameters captured by transaction events.
attributes.include = request.parameters.*

# Transaction tracer captures deep information about slow transactions and
# sends this to the service once per minute. Included in the transaction is
# the exact call sequence of the transactions including any SQL statements
# issued.
transaction_tracer.enabled = true

# Transaction tracer will capture all transactions over this duration (seconds).
transaction_tracer.transaction_threshold = apdex_f

# Transaction tracer may generate additional backtraces. Backtraces may
# significantly increase data bandwidth consumption because they are sent to
# the service for every sampled transaction.
transaction_tracer.record_sql = obfuscated

# Error collector captures information about uncaught exceptions and
# sends them to the service for viewing. The error collector is enabled
# by default.
error_collector.enabled = true

# To stop specific exceptions from reporting to the service, set this to
# a comma separated list of full exception class names.
# error_collector.ignore_errors =

# Browser monitoring captures the page load time of end users and sends
# this information to the service. This helps you understand the user
# experience for your application. While browser monitoring is usually
# enabled, you may disable it for specific applications or environments
# using this setting.
browser_monitoring.auto_instrument = true

# Thread profiler captures details about application threads and sends this
# information to the service for viewing. The thread profiler is enabled
# by default.
thread_profiler.enabled = true

# ---------------------------------------------------------------------------

#
# The application environments. These are specific settings which override
# the common environment settings. The settings related to a specific
# environment will be used when the environment argument to the
# newrelic.agent.initialize() function has been defined to be either
# "development", "test", "staging" or "production".
#

[newrelic:development]
monitor_mode = true

[newrelic:test]
monitor_mode = false

[newrelic:staging]
app_name = ${NEW_RELIC_APP_NAME:Fullstack Checkout Service (Staging)}
monitor_mode = true

[newrelic:production]
monitor_mode = true
